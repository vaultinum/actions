name: Deploy stack

on:
    workflow_call:
        inputs:
            registry:
                type: string
                default: "ghcr.io"
            image_name:
                required: true
                type: string
            deploy_environment_tag:
                required: false
                type: string
                description: "Tag used to deploy on all environments matching this tag"
            deploy_environment:
                required: true
                type: string
            secrets_suffix:
                required: false
                type: string
                description: "Suffix used to resolve external secret names, defaults to deploy_environment. Use this to run multiple stacks in the same deploy_environment with different credentials."
            deploy_port:
                required: true
                type: number
            tag:
                type: string
                default: "latest"
            config_name:
                type: string
                default: ""
            stack_name:
                required: true
                type: string
        secrets:
            PORTAINER_URL:
                required: true
            PORTAINER_API_KEY:
                required: true

concurrency:
    group: deploy-stack-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.image_name }}-${{ inputs.stack_name }}-${{ inputs.deploy_environment_tag || inputs.deploy_environment }}
    cancel-in-progress: true

jobs:
    get-endpoints:
        name: Get target endpoints
        uses: ./.github/workflows/get-portainer-endpoints.yaml
        with:
            deploy_environment_tag: ${{ inputs.deploy_environment_tag }}
        secrets:
            PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
            PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}

    deploy-stack:
        name: Deploy stack
        needs: get-endpoints
        runs-on: self-hosted
        timeout-minutes: 15
        if: needs.get-endpoints.outputs.endpoints != '[]'
        environment: ${{ inputs.deploy_environment }}
        env:
            PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
            PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        strategy:
            matrix:
                endpoint_id: ${{ fromJSON(needs.get-endpoints.outputs.endpoints) }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  repository: ${{ github.repository }}
                  ref: ${{ github.ref }}
            - name: Setup endpoint URL
              id: endpoint
              run: |
                  ENDPOINT_ID="${{ matrix.endpoint_id }}"
                  echo "Using endpoint ID: $ENDPOINT_ID for environment: ${{ inputs.deploy_environment }}"

                  BASE_URL=$(echo "$PORTAINER_URL" | cut -d'/' -f1-3)
                  echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT
                  echo "endpoint_id=$ENDPOINT_ID" >> $GITHUB_OUTPUT
                  echo "docker_url=$BASE_URL/api/endpoints/$ENDPOINT_ID/docker" >> $GITHUB_OUTPUT
            - name: List containers
              id: containers
              run: |
                  curl --insecure --get '${{ steps.endpoint.outputs.docker_url }}/containers/json' \
                       --data-urlencode 'filters={ "status": [ "running" ], "label": [ "com.docker.stack.namespace=${{ inputs.stack_name }}" ] }' \
                       --header "X-API-Key: $PORTAINER_API_KEY" | jq --raw-output '[.[].Id] | ["ids=", join(" ")] | add' >> $GITHUB_OUTPUT
            - name: Deploy to Docker Swarm using Portainer API
              run: |
                  echo "Checking for existing stack in Portainer..."

                  BASE_URL="${{ steps.endpoint.outputs.base_url }}"
                  ENDPOINT_ID="${{ steps.endpoint.outputs.endpoint_id }}"

                  fail_on_error() {
                      if [ "$1" -lt 200 ] || [ "$1" -ge 300 ]; then
                          echo "# :red_circle: Stack deployment failed (HTTP $1)" >> $GITHUB_STEP_SUMMARY
                          echo '```json' >> $GITHUB_STEP_SUMMARY
                          cat response.json >> $GITHUB_STEP_SUMMARY
                          echo '```' >> $GITHUB_STEP_SUMMARY
                          cat response.json
                          exit 1
                      fi
                  }

                  EXISTING_STACKS=$(curl --insecure --request GET "$BASE_URL/api/stacks" \
                      --header "X-API-KEY: $PORTAINER_API_KEY")

                  ENDPOINT_INFO=$(curl --insecure --request GET "$BASE_URL/api/endpoints/$ENDPOINT_ID/docker/info" \
                      --header "X-API-KEY: $PORTAINER_API_KEY")

                  STACK_INFO=$(echo "$EXISTING_STACKS" | jq -r --arg endpoint "$ENDPOINT_ID" '.[] | select(.Name=="${{ inputs.stack_name }}" and (.EndpointId|tostring)==$endpoint)')
                  STACK_ID=$(echo "$STACK_INFO" | jq -r '.Id')
                  SWARM_ID=$(echo $ENDPOINT_INFO | jq -r '.Swarm.Cluster.ID')

                  # Replace the image name in the docker-compose.yml file and convert the file content to a valid JSON string
                  STACK_FILE_CONTENT=$(cat docker-compose.yml | sed "s|image:.*|image: ${{ inputs.registry }}/${{ inputs.image_name }}:${{ inputs.tag }}|g" | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')

                  SECRETS_SUFFIX=$(echo "${{ inputs.secrets_suffix || inputs.deploy_environment }}" | tr '[:lower:]' '[:upper:]')

                  # Extract the list of secrets from the docker-compose.yml file
                  SECRETS_LIST=$(grep -oP '^\s*-\s+\K[A-Za-z0-9_]+(?:_[A-Za-z0-9]+)*' docker-compose.yml | grep -vE 'source|ports|volumes|configs')

                  ENV_VARS=""

                  # Populate the environment variables with the secret values
                  IFS=$'\n'
                  for SECRET in $SECRETS_LIST; do
                      ENV_VARS="${ENV_VARS}{ \"name\": \"$SECRET\", \"value\": \"${SECRET}_${SECRETS_SUFFIX}\" },"
                  done

                  # Add the additional environment variables
                  ENV_VARS="${ENV_VARS}{
                      \"name\": \"PORT\",
                      \"value\": \"${{ inputs.deploy_port }}\"
                  }, {
                      \"name\": \"CONFIG_NAME\",
                      \"value\": \"${{ inputs.config_name }}\"
                  }, {
                      \"name\": \"DEPLOY_ENVIRONMENT\",
                      \"value\": \"${{ inputs.deploy_environment }}\"
                  }"

                  # Remove the trailing comma from the environment variables list to make it a valid JSON array
                  if [[ $ENV_VARS == *, ]]; then
                      ENV_VARS="${ENV_VARS::-1}"
                  fi

                  if [ -z "$STACK_ID" ]; then
                      echo "Stack not found for name ${{ inputs.stack_name }}. Creating a new one."

                      cat <<EOF > request.json
                  {
                    "Name": "${{ inputs.stack_name }}",
                    "StackFileContent": "$STACK_FILE_CONTENT",
                    "SwarmID": "$SWARM_ID",
                    "Env": [$ENV_VARS]
                  }
                  EOF

                      HTTP_STATUS=$(curl --insecure --silent --output response.json --write-out "%{http_code}" --request POST "$BASE_URL/api/stacks/create/swarm/string?endpointId=$ENDPOINT_ID" \
                          --header "Content-Type: application/json" \
                          --header "X-API-KEY: $PORTAINER_API_KEY" \
                          --data "@request.json")
                      fail_on_error "$HTTP_STATUS"
                  else
                      echo "Stack found with ID $STACK_ID. Updating the stack."

                      cat <<EOF > request.json
                  {
                    "StackFileContent": "$STACK_FILE_CONTENT",
                    "Env": [$ENV_VARS]
                  }
                  EOF

                      HTTP_STATUS=$(curl --insecure --silent --output response.json --write-out "%{http_code}" --request PUT "$BASE_URL/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
                          --header "Content-Type: application/json" \
                          --header "X-API-KEY: $PORTAINER_API_KEY" \
                          --data "@request.json")
                      fail_on_error "$HTTP_STATUS"

                      echo "Stack updated successfully."
                  fi

                  cat response.json
            - name: Wait for new container to be stopped
              run: |
                  sleep 10

                  MAX_ATTEMPTS=36
                  ATTEMPT=0
                  STOPPED_COUNT=0
                  while [ $STOPPED_COUNT -eq 0 ]; do
                      ATTEMPT=$((ATTEMPT + 1))
                      if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
                          echo "# :red_circle: Timed out waiting for old containers to stop after stack update" >> $GITHUB_STEP_SUMMARY
                          exit 1
                      fi

                      STOPPED_COUNT=$(curl --insecure --get '${{ steps.endpoint.outputs.docker_url }}/containers/json' \
                          --data-urlencode 'filters={ "status": [ "exited" ], "label": [ "com.docker.stack.namespace=${{ inputs.stack_name }}" ] }' \
                          --header "X-API-Key: $PORTAINER_API_KEY" | jq '[.[]] | length')

                      echo "Stopped containers count: $STOPPED_COUNT (attempt $ATTEMPT/$MAX_ATTEMPTS)"

                      if [ $STOPPED_COUNT -gt 0 ]; then
                          echo "Container stopped!"
                          break
                      fi

                      sleep 5
                  done
            - name: Delete containers
              run: |
                  for containerId in ${{ steps.containers.outputs.ids }}
                  do
                    curl --insecure --request DELETE "${{ steps.endpoint.outputs.docker_url }}/containers/$containerId" \
                       --header "X-API-Key: $PORTAINER_API_KEY"
                  done
