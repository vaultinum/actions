name: Release - Rust

on:
    workflow_call:
        inputs:
            binary_name:
                type: string
                required: true
                description: "Base binary name matching the Cargo package name"
            version:
                type: string
                default: ""
                description: "Release version tag (e.g. v1.2.3). Leave blank to use the version from Cargo.toml."
            run_tests:
                type: boolean
                default: true
                description: "Run cargo test before version bump (Run A)"
            test_features:
                type: string
                default: ""
                description: "Cargo features to enable during cargo test"
            extra_feature:
                type: string
                default: ""
                description: "Feature flag for a second build variant per platform. Empty = no extra variant."
            timeout-minutes:
                type: number
                default: 30
            azure_client_id:
                type: string
                default: ""
                description: "Azure AD App Registration client ID for OIDC (Windows Authenticode signing via Azure Artifact Signing). Empty = skip Windows signing."
            azure_tenant_id:
                type: string
                default: ""
                description: "Azure AD tenant ID for OIDC signing auth."
            azure_subscription_id:
                type: string
                default: ""
                description: "Azure subscription ID containing the Artifact Signing account."
            azure_signing_account_name:
                type: string
                default: ""
                description: "Azure Artifact Signing account name."
            azure_certificate_profile_name:
                type: string
                default: ""
                description: "Azure Artifact Signing certificate profile name."
            azure_signing_endpoint:
                type: string
                default: ""
                description: "Azure Artifact Signing account endpoint URI (region-specific, e.g. https://weu.codesigning.azure.net/)."
        outputs:
            version:
                description: "Released version tag"
                value: ${{ jobs.check-version.outputs.version }}
        secrets:
            GH_TOKEN:
                required: true
            NPM_PACKAGE_ACCESS:
                required: true
            LAUNCHER_TOKEN:
                required: false
            MACOS_CERT_P12:
                required: false
            MACOS_CERT_PASSWORD:
                required: false
            APPLE_API_KEY:
                required: false
            APPLE_API_KEY_ID:
                required: false
            APPLE_API_ISSUER:
                required: false

concurrency:
    group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    # ── Run A: regular feature push ────────────────────────────────────────────
    # Runs on regular commits to main. Tests and a build check gate the version
    # bump; if either fails, no release commit is pushed.

    pre-release-check:
        name: Pre-release Check
        runs-on: ubuntu-latest
        if: >-
            github.event_name == 'push' &&
            !startsWith(github.event.head_commit.message, 'chore: release')
        steps:
            - uses: actions/checkout@v5
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
            - name: Run tests
              if: ${{ inputs.run_tests == true }}
              shell: bash
              run: |
                  FEATURES="${{ inputs.test_features }}"
                  if [ -n "$FEATURES" ]; then
                      cargo test --features "$FEATURES"
                  else
                      cargo test
                  fi
            - name: Build check
              shell: bash
              run: cargo build --release

    version-bump:
        name: Bump Version
        runs-on: ubuntu-latest
        needs: pre-release-check
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: main
                  token: ${{ secrets.NPM_PACKAGE_ACCESS }}
            - name: Install release-plz
              uses: taiki-e/install-action@v2
              with:
                  tool: release-plz
            - name: Bump version via release-plz
              shell: bash
              run: release-plz update
            - name: Commit and push version bump
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A
                  VERSION="v$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
                  git diff --staged --quiet || git commit -m "chore: release $VERSION"
                  git push

    # ── Run B: manual promotion only ────────────────────────────────────────────
    # Builds, signs and publishes the GitHub Release. Only runs via workflow_dispatch
    # (e.g. from deploy-prod.yml) — never automatically.

    matrix-prep:
        name: Prepare Build Matrix
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch'
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            - name: Generate matrix
              id: set-matrix
              shell: bash
              run: |
                  EXTRA="${{ inputs.extra_feature }}"

                  BASE=$(jq -n '
                      [
                          {"os":"ubuntu-latest","features":"","binary_suffix":"-linux","exe_ext":""},
                          {"os":"windows-latest","features":"","binary_suffix":"-windows","exe_ext":".exe"},
                          {"os":"macos-latest","features":"","binary_suffix":"-macos","exe_ext":""}
                      ]
                  ')

                  if [ -n "$EXTRA" ]; then
                      EXTRA_ENTRIES=$(jq -n --arg e "$EXTRA" '
                          [
                              {"os":"ubuntu-latest","features":$e,"binary_suffix":("-linux-"+$e),"exe_ext":""},
                              {"os":"windows-latest","features":$e,"binary_suffix":("-windows-"+$e),"exe_ext":".exe"},
                              {"os":"macos-latest","features":$e,"binary_suffix":("-macos-"+$e),"exe_ext":""}
                          ]
                      ')
                      MATRIX=$(printf '%s\n%s' "$BASE" "$EXTRA_ENTRIES" | jq -s 'add')
                  else
                      MATRIX="$BASE"
                  fi

                  echo "matrix=$(echo "$MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"

    check-version:
        name: Resolve Version
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch'
        outputs:
            version: ${{ steps.resolve.outputs.version }}
        steps:
            - uses: actions/checkout@v5
            - name: Resolve version
              id: resolve
              shell: bash
              run: |
                  INPUT="${{ inputs.version }}"
                  if [ -n "$INPUT" ]; then
                      VERSION="$INPUT"
                  else
                      VERSION="v$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)"
                  fi
                  echo "Resolved version: $VERSION"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    build:
        name: Build [${{ matrix.binary_suffix }}]
        needs: [matrix-prep, check-version]
        runs-on: ${{ matrix.os }}
        timeout-minutes: ${{ inputs.timeout-minutes }}
        permissions:
            id-token: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
        steps:
            - uses: actions/checkout@v5
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
            - name: Cache Cargo
              uses: Swatinem/rust-cache@v2
            - name: Build
              shell: bash
              env:
                  LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
              run: |
                  FEATURES="${{ matrix.features }}"
                  if [ -n "$FEATURES" ]; then
                      cargo build --release --features "$FEATURES"
                  else
                      cargo build --release
                  fi
            - name: Rename binary
              shell: bash
              run: |
                  mv "target/release/${{ inputs.binary_name }}${{ matrix.exe_ext }}" \
                     "target/release/${{ inputs.binary_name }}${{ matrix.binary_suffix }}${{ matrix.exe_ext }}"
            - name: Check macOS signing secret
              if: matrix.os == 'macos-latest'
              id: macos_signing
              shell: bash
              env:
                  MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
              run: echo "enabled=$([ -n "$MACOS_CERT_P12" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            - name: Import macOS signing certificate
              if: matrix.os == 'macos-latest' && steps.macos_signing.outputs.enabled == 'true'
              uses: apple-actions/import-codesign-certs@v7
              with:
                  p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
                  p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
            - name: Sign macOS binary
              if: matrix.os == 'macos-latest' && steps.macos_signing.outputs.enabled == 'true'
              shell: bash
              run: |
                  codesign --sign "Developer ID Application" --options runtime --timestamp \
                      "target/release/${{ inputs.binary_name }}${{ matrix.binary_suffix }}${{ matrix.exe_ext }}"
            - name: Notarize macOS binary
              if: matrix.os == 'macos-latest' && steps.macos_signing.outputs.enabled == 'true'
              shell: bash
              env:
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
              run: |
                  BIN="target/release/${{ inputs.binary_name }}${{ matrix.binary_suffix }}${{ matrix.exe_ext }}"
                  ZIP="target/release/${{ inputs.binary_name }}${{ matrix.binary_suffix }}.zip"
                  mkdir -p /tmp/notary-key
                  echo "$APPLE_API_KEY" > /tmp/notary-key/AuthKey.p8
                  ditto -c -k --keepParent "$BIN" "$ZIP"
                  xcrun notarytool submit "$ZIP" \
                      --key /tmp/notary-key/AuthKey.p8 \
                      --key-id "$APPLE_API_KEY_ID" \
                      --issuer "$APPLE_API_ISSUER" \
                      --wait
                  rm -rf /tmp/notary-key "$ZIP"
            - name: Azure login (Windows signing)
              if: matrix.os == 'windows-latest' && inputs.azure_client_id != ''
              uses: azure/login@v3
              with:
                  client-id: ${{ inputs.azure_client_id }}
                  tenant-id: ${{ inputs.azure_tenant_id }}
                  subscription-id: ${{ inputs.azure_subscription_id }}
            - name: Sign Windows binary
              if: matrix.os == 'windows-latest' && inputs.azure_client_id != ''
              uses: azure/artifact-signing-action@v2
              with:
                  endpoint: ${{ inputs.azure_signing_endpoint }}
                  signing-account-name: ${{ inputs.azure_signing_account_name }}
                  certificate-profile-name: ${{ inputs.azure_certificate_profile_name }}
                  files: ${{ github.workspace }}/target/release/${{ inputs.binary_name }}${{ matrix.binary_suffix }}${{ matrix.exe_ext }}
                  file-digest: SHA256
                  timestamp-rfc3161: http://timestamp.acs.microsoft.com
                  timestamp-digest: SHA256
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ inputs.binary_name }}${{ matrix.binary_suffix }}
                  path: target/release/${{ inputs.binary_name }}${{ matrix.binary_suffix }}${{ matrix.exe_ext }}

    release:
        name: Create GitHub Release
        needs: [check-version, build]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts/
                  merge-multiple: true
            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.check-version.outputs.version }}
                  name: Release ${{ needs.check-version.outputs.version }}
                  generate_release_notes: true
                  files: artifacts/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
