name: Get Portainer endpoints

on:
    workflow_call:
        inputs:
            deploy_environment_tag:
                required: false
                type: string
                description: "Tag used to deploy on all environments matching this tag"
        outputs:
            endpoints:
                description: "JSON array of matching Portainer endpoint IDs"
                value: ${{ jobs.get-endpoints.outputs.endpoints }}
        secrets:
            PORTAINER_URL:
                required: true
            PORTAINER_API_KEY:
                required: true

jobs:
    get-endpoints:
        name: Get target endpoints
        runs-on: self-hosted
        timeout-minutes: 5
        outputs:
            endpoints: ${{ steps.get-endpoints.outputs.endpoints }}
        steps:
            - name: Get target endpoints
              id: get-endpoints
              env:
                  PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
                  PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
                  DEPLOY_ENVIRONMENT_TAG: ${{ inputs.deploy_environment_tag }}
              run: |
                  # Extract the base URL from the PORTAINER_URL secret
                  BASE_URL=$(echo "$PORTAINER_URL" | cut -d'/' -f1-3)

                  if [ -z "$DEPLOY_ENVIRONMENT_TAG" ]; then
                      # No tag - use the endpoint from PORTAINER_URL directly
                      ENDPOINT_ID=$(echo "$PORTAINER_URL" | sed -E 's#.*/endpoints/([0-9]+)/.*#\1#')
                      echo "No tag specified - using endpoint from PORTAINER_URL: $ENDPOINT_ID"
                      echo "endpoints=[\"$ENDPOINT_ID\"]" >> $GITHUB_OUTPUT

                  else
                      # Tag specified - get all endpoints that have this tag
                      echo "Tag specified: $DEPLOY_ENVIRONMENT_TAG"

                      TAGS_RESPONSE=$(curl --insecure --request GET "$BASE_URL/api/tags" \
                          --header "X-API-Key: $PORTAINER_API_KEY")

                      # Find the tag and extract its endpoints
                      TAG_INFO=$(echo "$TAGS_RESPONSE" | jq -r --arg tag "$DEPLOY_ENVIRONMENT_TAG" \
                          '.[] | select(.Name == $tag)')

                      if [ -z "$TAG_INFO" ] || [ "$TAG_INFO" = "null" ]; then
                          echo "Tag '$DEPLOY_ENVIRONMENT_TAG' not found in Portainer"
                          echo "Available tags:"
                          echo "$TAGS_RESPONSE" | jq -r '.[].Name' | head -10
                          echo "endpoints=[]" >> $GITHUB_OUTPUT
                          exit 0
                      fi

                      ENDPOINT_IDS=$(echo "$TAG_INFO" | jq -c '.Endpoints | keys | map(tostring)')

                      if [ "$ENDPOINT_IDS" = "[]" ] || [ -z "$ENDPOINT_IDS" ]; then
                          echo "No endpoints found for tag '$DEPLOY_ENVIRONMENT_TAG'"
                          echo "endpoints=[]" >> $GITHUB_OUTPUT
                      else
                          echo "Found endpoints for tag '$DEPLOY_ENVIRONMENT_TAG': $ENDPOINT_IDS"
                          echo "endpoints=$ENDPOINT_IDS" >> $GITHUB_OUTPUT
                      fi
                  fi
